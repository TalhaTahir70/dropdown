<!DOCTYPE html>
<html>
<head>
    <title>Simple Dropdown Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .menu {
            list-style-type: none;
        }

        .menu-item {
            float: left;
            position: relative;
        }

        .menu-item a {
            display: block;
            color: white;
            background-color: #333;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .menu-item a:hover {
            background-color: #111;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        }

        .dropdown-item a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-item a:hover {
            background-color: #f1f1f1;
        }

        .menu-item:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>
<body>
    <ul class="menu">
        <li class="menu-item dropdown">
            <a href="#">Social Media</a>
            <ul class="dropdown-menu">
                <li class="dropdown-item"><a href="https://www.youtube.com" target="_blank">Youtube</a></li>
                <li class="dropdown-item"><a href="https://www.Instagram.com"target="_blank">Instagram</a></li>
                <li class="dropdown-item"><a href="https://www.whatsapp.com"target="_blank">WhatsApp</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
